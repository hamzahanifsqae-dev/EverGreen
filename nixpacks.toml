[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.json", "php83Extensions.bcmath", "php83Extensions.fileinfo", "php83Extensions.openssl", "php83Extensions.gd", "php83Extensions.zip", "php83Packages.composer", "nodejs_22", "npm-10_x"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci || npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache",
  "chmod -R ug+rwx storage bootstrap/cache"
]

[start]
cmd = "bash railway-start.sh"
